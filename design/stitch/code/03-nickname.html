<!-- Interactive Logic for Input, Chip Click, Character Counter & Generator -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('nickname-input');
      const counter = document.getElementById('char-count');
      const chips = document.querySelectorAll('.suggestion-chip');
      const refreshBtn = document.getElementById('btn-refresh');
      const submitBtn = document.getElementById('submit-btn');

      const namePool = [
        { icon: '☁️', name: '폭신한구름' },
        { icon: '🌰', name: '달콤한도토리' },
        { icon: '🌱', name: '초록새싹' },
        { icon: '🐾', name: '말랑젤리' },
        { icon: '🍯', name: '달콤꿀단지' },
        { icon: '🥐', name: '따뜻한소라빵' },
        { icon: '🍓', name: '딸기마카롱' },
        { icon: '🐥', name: '노랑병아리' }
      ];

      // Update character counter and button state
      function handleInputChange() {
        const val = input.value.trim();
        counter.textContent = val.length;
        if (val.length >= 2 && val.length <= 10) {
          submitBtn.classList.remove('opacity-70');
          submitBtn.style.filter = 'none';
        } else {
          submitBtn.classList.add('opacity-70');
        }
      }

      input.addEventListener('input', handleInputChange);

      // Handle suggestion chip selection
      function attachChipListeners() {
        document.querySelectorAll('.suggestion-chip').forEach(chip => {
          chip.onclick = () => {
            const chosen = chip.getAttribute('data-name');
            input.value = chosen;
            handleInputChange();
            input.focus();
            
            // Visual bounce feedback on selected chip
            chip.classList.add('scale-95', 'bg-[#FFE2D1]');
            setTimeout(() => {
              chip.classList.remove('scale-95', 'bg-[#FFE2D1]');
            }, 180);
          };
        });
      }

      attachChipListeners();

      // Refresh name suggestions
      refreshBtn.addEventListener('click', () => {
        const container = document.getElementById('chip-container');
        // Shuffle pool
        const shuffled = [...namePool].sort(() => 0.5 - Math.random()).slice(0, 4);
        container.innerHTML = shuffled.map(item => `
          <button type="button" class="suggestion-chip clay-tag rounded-full px-3.5 py-1.5 text-label-md font-label-md text-[#3B2F2F] font-bold flex items-center space-x-1" data-name="${item.name}">
            <span class="text-[13px]">${item.icon}</span>
            <span>${item.name}</span>
          </button>
        `).join('');
        attachChipListeners();
      });

      // Submit feedback
      submitBtn.addEventListener('click', () => {
        const val = input.value.trim();
        if (val.length < 2) {
          input.focus();
          input.classList.add('border-[#BA1A1A]', 'ring-2', 'ring-[#BA1A1A]/20');
          setTimeout(() => {
            input.classList.remove('border-[#BA1A1A]', 'ring-2', 'ring-[#BA1A1A]/20');
          }, 800);
        } else {
          // Success press visual
          submitBtn.innerText = '환영해요! 🌿';
          setTimeout(() => {
            submitBtn.innerHTML = '<span>시작하기</span><span class="text-base">🐾</span>';
          }, 1200);
        }
      });

      // Initialize
      handleInputChange();
    });
  </script>
