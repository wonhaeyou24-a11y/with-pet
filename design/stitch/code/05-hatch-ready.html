<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>펫과함께 - 알 부화 직전</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      font-family: 'Noto Sans KR', 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF4D6;
      color: #3B2F2F;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .clay-bg-dots {
      background-color: #FFF4D6;
      background-image: radial-gradient(#F0DFB8 1.75px, transparent 1.75px);
      background-size: 20px 20px;
    }

    /* Wobble animation for the egg */
    @keyframes egg-wobble {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      15% {
        transform: rotate(-5deg) translateY(-2px);
      }
      30% {
        transform: rotate(4.5deg) translateY(0);
      }
      45% {
        transform: rotate(-3.5deg) translateY(-1px);
      }
      60% {
        transform: rotate(2.5deg) translateY(0);
      }
      75% {
        transform: rotate(-1.5deg) translateY(-1px);
      }
      90% {
        transform: rotate(0deg) translateY(0);
      }
    }

    .animate-egg-wobble {
      animation: egg-wobble 2.2s ease-in-out infinite;
      transform-origin: 50% 90%;
    }

    /* Motion lines shake */
    @keyframes motion-pulse-left {
      0%, 100% { opacity: 0.35; transform: translateX(0) scale(0.95); }
      20% { opacity: 0.95; transform: translateX(-4px) scale(1.08); }
      40% { opacity: 0.5; transform: translateX(-1px) scale(1); }
      70% { opacity: 0.9; transform: translateX(-3px) scale(1.05); }
    }
    @keyframes motion-pulse-right {
      0%, 100% { opacity: 0.35; transform: translateX(0) scale(0.95); }
      25% { opacity: 0.95; transform: translateX(4px) scale(1.08); }
      50% { opacity: 0.5; transform: translateX(1px) scale(1); }
      75% { opacity: 0.9; transform: translateX(3px) scale(1.05); }
    }

    .animate-motion-left {
      animation: motion-pulse-left 2.2s ease-in-out infinite;
    }
    .animate-motion-right {
      animation: motion-pulse-right 2.2s ease-in-out infinite;
    }

    /* Golden warm halo breathing */
    @keyframes golden-halo {
      0%, 100% {
        transform: scale(0.96);
        opacity: 0.65;
        filter: blur(20px);
      }
      50% {
        transform: scale(1.14);
        opacity: 0.95;
        filter: blur(28px);
      }
    }

    .animate-halo {
      animation: golden-halo 2.4s ease-in-out infinite;
    }

    /* Sparkle twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(18deg); }
    }

    .animate-sparkle-1 { animation: twinkle 1.8s ease-in-out infinite; }
    .animate-sparkle-2 { animation: twinkle 2.3s ease-in-out infinite 0.6s; }
    .animate-sparkle-3 { animation: twinkle 2.0s ease-in-out infinite 1.1s; }

    /* Button gentle pulse */
    @keyframes clay-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 24px rgba(255, 138, 101, 0.42), 0 2px 4px rgba(255, 138, 101, 0.25), inset 0 2px 3px rgba(255, 255, 255, 0.4);
      }
      50% {
        transform: scale(1.025);
        box-shadow: 0 14px 32px rgba(255, 138, 101, 0.58), 0 4px 10px rgba(255, 138, 101, 0.35), inset 0 3px 5px rgba(255, 255, 255, 0.6);
      }
    }

    .animate-clay-pulse {
      animation: clay-pulse 2s ease-in-out infinite;
    }

    /* Heartbeat text subtle rhythm */
    @keyframes heart-throb {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.08); }
      28% { transform: scale(1); }
      42% { transform: scale(1.12); }
      70% { transform: scale(1); }
    }
    .animate-heart-throb {
      display: inline-block;
      animation: heart-throb 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="clay-bg-dots min-h-screen flex justify-center items-stretch antialiased selection:bg-[#FF8A65]/30">
  <!-- Mobile Container (Max 390px, Mobile Portrait Form Factor) -->
  <main class="w-full max-w-[390px] min-h-screen flex flex-col justify-between px-5 pt-4 pb-8 relative shadow-2xl mx-auto overflow-hidden bg-[#FFF4D6] clay-bg-dots">

    <!-- 1. Slim Top Bar ("펫과함께" + nickname pill "초록집사") -->
    <header class="w-full flex items-center justify-between pt-1 pb-3 z-20">
      <!-- Brand Logo / Title with Cute Paw -->
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6 text-[#FF8A65]" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 10.5c-2.4 0-4.3 1.8-4.3 3.9 0 2 1.9 3.6 4.3 3.6s4.3-1.6 4.3-3.6c0-2.1-1.9-3.9-4.3-3.9zM5.5 11c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm13 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-8.8-4.8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm4.6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
        </svg>
        <span class="font-extrabold text-[21px] tracking-tight text-[#FF8A65]">펫과함께</span>
      </div>

      <!-- Nickname Pill ("초록집사") -->
      <div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#FFFFFF]/90 border border-[#F0DFB8] shadow-sm backdrop-blur-sm">
        <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-[#E8F5E9] text-[#2E7D32]">
          <span class="material-symbols-rounded text-[13px]">eco</span>
        </span>
        <span class="text-[13px] font-bold text-[#3B2F2F] tracking-tight">초록집사</span>
      </div>
    </header>

    <!-- 2. Main Stage Card: Wobbling Egg with Golden Halo, Sparkles, and Crack -->
    <section class="w-full my-auto flex flex-col items-center z-10 pt-1 pb-2">
      <div class="w-full bg-[#FFFFFF] rounded-[36px] border border-[#F0DFB8] shadow-[0_16px_36px_rgba(159,65,34,0.06),0_2px_8px_rgba(240,223,184,0.5)] p-6 pt-5 pb-7 flex flex-col items-center relative overflow-hidden">
        
        <!-- Status Pill Tag -->
        <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-[#FFF0E6] border border-[#FFD8C7] mb-3">
          <span class="w-2 h-2 rounded-full bg-[#FF8A65] animate-ping opacity-75"></span>
          <span class="text-[12px] font-bold text-[#FF8A65] tracking-wide">부화 준비 완료 ✨</span>
        </div>

        <!-- Egg Interactive Stage Area -->
        <div class="relative w-full h-[270px] flex items-center justify-center">

          <!-- Golden Warm Glow Halo Background -->
          <div class="absolute w-[210px] h-[210px] rounded-full bg-gradient-to-tr from-[#FFE082]/70 via-[#FFD54F]/50 to-[#FFAB91]/60 animate-halo pointer-events-none"></div>
          <div class="absolute w-[160px] h-[160px] rounded-full bg-gradient-to-b from-[#FFF9C4]/80 to-[#FFE082]/50 blur-xl pointer-events-none"></div>

          <!-- Floating Ambient Sparkles -->
          <!-- Top Left Sparkle -->
          <div class="absolute top-6 left-8 animate-sparkle-1 pointer-events-none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 0L14.4 9.6L24 12L14.4 14.4L12 24L9.6 14.4L0 12L9.6 9.6L12 0Z" fill="#FFA726"/>
            </svg>
          </div>
          <!-- Top Right Sparkle -->
          <div class="absolute top-8 right-9 animate-sparkle-2 pointer-events-none">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z" fill="#FF8A65"/>
            </svg>
          </div>
          <!-- Mid Right Small Sparkle -->
          <div class="absolute top-28 right-5 animate-sparkle-3 pointer-events-none">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10L12 0Z" fill="#FDD835"/>
            </svg>
          </div>
          <!-- Mid Left Small Sparkle -->
          <div class="absolute bottom-20 left-6 animate-sparkle-2 pointer-events-none">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
              <path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10L12 0Z" fill="#FFB74D"/>
            </svg>
          </div>

          <!-- Motion Lines on Both Sides (indicating wobbling) -->
          <!-- Left Motion Lines -->
          <div class="absolute left-6 top-[46%] -translate-y-1/2 flex flex-col gap-2 animate-motion-left pointer-events-none">
            <svg width="24" height="42" viewBox="0 0 24 42" fill="none">
              <path d="M20 4C11 10 7 16 9 24" stroke="#FF8A65" stroke-width="3" stroke-linecap="round"/>
              <path d="M22 14C15 19 12 25 14 34" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M16 28C10 32 8 36 9 40" stroke="#FF8A65" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
            </svg>
          </div>

          <!-- Right Motion Lines -->
          <div class="absolute right-6 top-[46%] -translate-y-1/2 flex flex-col gap-2 animate-motion-right pointer-events-none">
            <svg width="24" height="42" viewBox="0 0 24 42" fill="none">
              <path d="M4 4C13 10 17 16 15 24" stroke="#FF8A65" stroke-width="3" stroke-linecap="round"/>
              <path d="M2 14C9 19 12 25 10 34" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M8 28C14 32 16 36 15 40" stroke="#FF8A65" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
            </svg>
          </div>

          <!-- The Wobbling Egg & Nest Assembly -->
          <div class="relative flex flex-col items-center animate-egg-wobble cursor-pointer">
            
            <!-- Sprout On Top -->
            <div class="relative z-20 mb-[-10px] transform -translate-y-1">
              <svg width="34" height="26" viewBox="0 0 34 26" fill="none">
                <path d="M17 25V13" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
                <path d="M17 14C17 9 22 5 29 6C30 11 25 16 17 14Z" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
                <path d="M17 16C16 11 11 8 5 9C4 14 9 18 17 16Z" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/>
              </svg>
            </div>

            <!-- The Main Egg Body (Warm Soft Clay Style) -->
            <div class="relative w-[158px] h-[198px] rounded-[50%_50%_48%_48%_/_62%_62%_38%_38%] bg-gradient-to-b from-[#FFFDF7] via-[#FFF5E4] to-[#FBE6C6] border-2 border-[#EEDBBA] shadow-[inset_0_-8px_16px_rgba(235,178,130,0.3),inset_0_8px_12px_rgba(255,255,255,0.9),0_12px_24px_rgba(159,65,34,0.12)] flex flex-col items-center justify-center overflow-hidden">
              
              <!-- Subtle Cute Freckles/Speckles on Egg -->
              <span class="absolute top-10 left-9 w-2 h-2 rounded-full bg-[#EED8B5]/70"></span>
              <span class="absolute top-14 left-7 w-1.5 h-1.5 rounded-full bg-[#EED8B5]/60"></span>
              <span class="absolute top-11 right-9 w-2 h-2 rounded-full bg-[#EED8B5]/70"></span>
              <span class="absolute bottom-16 right-7 w-1.5 h-1.5 rounded-full bg-[#EED8B5]/60"></span>

              <!-- Small Crack Starting at the Top with Golden Light Emanating -->
              <div class="absolute top-3 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center">
                <!-- Crack SVG with Inner Glow -->
                <svg width="44" height="42" viewBox="0 0 44 42" fill="none">
                  <!-- Golden Light Seeping through crack -->
                  <path d="M22 2L20 12L25 18L18 25L23 33L21 38" stroke="#FFD54F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="blur(2px)"/>
                  <!-- Sharp Crack Lines -->
                  <path d="M22 2L19.5 12L25 18.5L18 25.5L23.5 33.5L21 39" stroke="#795548" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- Secondary Micro Crack Branches -->
                  <path d="M25 18.5L30 16" stroke="#8D6E63" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M18 25.5L12 28" stroke="#8D6E63" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M19.5 12L15 9" stroke="#8D6E63" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </div>

              <!-- Egg Face (Excited / Happy Shiver Eyes & Cheeks) -->
              <div class="relative z-10 flex flex-col items-center mt-9">
                <!-- Eyes: Happy arched sleeping/trembling curves -->
                <div class="flex items-center gap-7 mb-2">
                  <!-- Left Eye -->
                  <svg width="18" height="10" viewBox="0 0 18 10" fill="none">
                    <path d="M2 8C5 2 13 2 16 8" stroke="#3B2F2F" stroke-width="2.8" stroke-linecap="round"/>
                  </svg>
                  <!-- Right Eye -->
                  <svg width="18" height="10" viewBox="0 0 18 10" fill="none">
                    <path d="M2 8C5 2 13 2 16 8" stroke="#3B2F2F" stroke-width="2.8" stroke-linecap="round"/>
                  </svg>
                </div>

                <!-- Rosy Warm Cheeks -->
                <div class="flex items-center gap-12 -mt-1">
                  <span class="w-4 h-2.5 rounded-full bg-[#FF8A65]/40 blur-[1px]"></span>
                  <span class="w-4 h-2.5 rounded-full bg-[#FF8A65]/40 blur-[1px]"></span>
                </div>

                <!-- Cute tiny dot mouth -->
                <span class="w-1.5 h-1.5 rounded-full bg-[#5D4037] mt-1.5"></span>
              </div>

              <!-- Glowing heart symbol inside egg (warm vitality) -->
              <div class="absolute bottom-5 z-10 opacity-75">
                <span class="material-symbols-rounded text-[#FF8A65] text-lg animate-pulse">favorite</span>
              </div>
            </div>

            <!-- Soft Clay Nest/Pedestal -->
            <div class="relative -mt-5 z-10 w-[172px] h-[38px] rounded-full bg-gradient-to-b from-[#FFF2D6] to-[#F5DEC0] border border-[#E8CDA9] shadow-[0_6px_14px_rgba(159,65,34,0.12),inset_0_2px_4px_rgba(255,255,255,0.8)] flex items-center justify-center gap-2">
              <span class="w-2 h-2 rounded-full bg-[#E0BA88]/60"></span>
              <span class="material-symbols-rounded text-[13px] text-[#C99C67]">sparkles</span>
              <span class="w-2 h-2 rounded-full bg-[#E0BA88]/60"></span>
            </div>
          </div>
        </div>

        <!-- Descriptive Text Section -->
        <div class="text-center mt-3 mb-1">
          <h2 class="text-[20px] font-extrabold text-[#3B2F2F] tracking-tight leading-snug flex items-center justify-center gap-1.5">
            알이 곧 깨어날 것 같아요
            <span class="text-[#FF8A65] text-xl">🐣</span>
          </h2>
          <p class="text-[14px] font-semibold text-[#8C6B58] mt-1.5 flex items-center justify-center gap-1">
            <span>두근두근… 안에서 무언가 움직여요</span>
            <span class="material-symbols-rounded text-[15px] text-[#FF8A65] animate-heart-throb">favorite</span>
          </p>
        </div>

      </div>
    </section>

    <!-- 3. Bottom Action: Single Extra-Large Coral Clay Button ("부화시키기!") -->
    <footer class="w-full flex flex-col items-center pt-2 pb-2 z-20">
      
      <!-- Extra-Large Coral Clay Button -->
      <button type="button" class="w-full py-4 px-6 rounded-[28px] bg-gradient-to-r from-[#FF8A65] via-[#FF7A50] to-[#FF8A65] text-white font-extrabold text-[19px] tracking-wide border-2 border-[#FFA082] animate-clay-pulse active:scale-95 transition-transform flex items-center justify-center gap-2.5 cursor-pointer">
        <span class="material-symbols-rounded text-[24px] text-[#FFF9C4]">auto_awesome</span>
        <span>부화시키기!</span>
      </button>

      <!-- Reassuring Microcopy -->
      <p class="text-[12px] font-medium text-[#A68A78] mt-2.5 text-center flex items-center justify-center gap-1">
        <span>어떤 귀여운 친구가 태어날까요?</span>
        <span class="inline-block">✨</span>
      </p>

    </footer>

  </main>
</body>
</html>
