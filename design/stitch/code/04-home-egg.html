<style>
    /* Warm Clay Custom Styling & Tactile Shadows */
    .clay-surface-bg {
      background-color: #FFF4D6;
      background-image: radial-gradient(#E8D7B0 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .clay-card {
      background-color: #FFFFFF;
      border: 2px solid #F0DFB8;
      box-shadow: 0 8px 24px rgba(186, 142, 75, 0.12), inset 0 2px 0 rgba(255, 255, 255, 0.9);
    }
    .clay-btn-coral {
      background-color: #FF8A65;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4), inset 0 -4px 0 #E56E49, 0 6px 16px rgba(255, 138, 101, 0.32);
      transition: all 0.15s ease-out;
    }
    .clay-btn-coral:active {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), inset 0 -1px 0 #E56E49, 0 2px 6px rgba(255, 138, 101, 0.25);
    }
    .clay-btn-mint {
      background-color: #5EBAA0;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4), inset 0 -4px 0 #469680, 0 6px 16px rgba(94, 186, 160, 0.32);
      transition: all 0.15s ease-out;
    }
    .clay-btn-mint:active {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), inset 0 -1px 0 #469680, 0 2px 6px rgba(94, 186, 160, 0.25);
    }
    .clay-pill-badge {
      background-color: #FFF9ED;
      border: 1.5px solid #F0DFB8;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 2px 6px rgba(186, 142, 75, 0.08);
    }
    @keyframes gentle-sway {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes sleep-float {
      0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
      50% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(16px, -24px) scale(1.2); }
    }
    .animate-gentle-sway {
      animation: gentle-sway 4s ease-in-out infinite;
    }
    .sleep-z1 {
      animation: sleep-float 2.8s ease-in-out infinite;
    }
    .sleep-z2 {
      animation: sleep-float 2.8s ease-in-out infinite 1.2s;
    }
  </style>

<!-- Interactive Subtle Feedback Script -->
<script>
    // Lightweight tactile click feedback
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const stage = document.querySelector('.animate-gentle-sway');
        if (stage) {
          stage.style.transform = 'scale(1.04) translateY(-8px)';
          setTimeout(() => {
            stage.style.transform = '';
          }, 300);
        }
      });
    });
  </script>
