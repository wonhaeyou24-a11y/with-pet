<script>
    // Lightweight interactive feedback for palette selection & tool clicks
    document.addEventListener('DOMContentLoaded', () => {
      const droplets = document.querySelectorAll('.clay-droplet');
      droplets.forEach(droplet => {
        droplet.addEventListener('click', function() {
          droplets.forEach(d => {
            d.classList.remove('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-surface-container-lowest');
            const check = d.querySelector('span');
            if (check && !d.classList.contains('bg-gradient-to-tr')) check.remove();
          });
          this.classList.add('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-surface-container-lowest');
          if (!this.querySelector('span') && !this.classList.contains('bg-gradient-to-tr')) {
            const checkEl = document.createElement('span');
            checkEl.className = 'absolute inset-0 flex items-center justify-center text-white font-label-sm text-[10px]';
            checkEl.textContent = '✓';
            this.appendChild(checkEl);
          }
        });
      });
    });
  </script>
