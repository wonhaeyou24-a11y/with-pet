<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>펫과함께 - 새 친구 이름 짓기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FFF4D6',
            creamCard: '#FFFFFF',
            warmBorder: '#F0DFB8',
            clayCoral: '#FF8A65',
            darkBrown: '#3B2F2F',
            windTeal: '#4DB6AC',
            windBg: '#E0F2F1',
            softPill: '#FFFDF9'
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            clay: '0 8px 20px -4px rgba(255, 138, 101, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -3px 4px rgba(0, 0, 0, 0.1)',
            card: '0 10px 28px rgba(180, 140, 90, 0.08), 0 2px 6px rgba(180, 140, 90, 0.04)',
            pill: 'inset 0 2px 4px rgba(180, 140, 90, 0.08), 0 1px 2px rgba(255, 255, 255, 0.8)'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5EEDB;
      font-family: 'Noto Sans KR', sans-serif;
      color: #3B2F2F;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Polka dot subtle background matching Home */
    .bg-pattern {
      background-color: #FFF4D6;
      background-image: radial-gradient(#F2DEB0 1.2px, transparent 1.2px);
      background-size: 16px 16px;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    .animate-float {
      animation: gentleFloat 3.4s ease-in-out infinite;
    }

    @keyframes cloudGlow {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .animate-cloud {
      animation: cloudGlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="p-0 sm:p-4">
  <!-- Mobile Container (390px portrait standard) -->
  <div class="w-[390px] h-[844px] max-w-full bg-pattern rounded-[40px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-[3px] border-[#EAD7AA]">
    
    <!-- Top Navigation Bar -->
    <header class="pt-6 px-6 pb-2 flex items-center justify-between z-10">
      <button class="w-10 h-10 rounded-full bg-white/90 border border-warmBorder flex items-center justify-center text-darkBrown shadow-sm active:scale-95 transition-transform" aria-label="뒤로가기">
        <span class="material-symbols-rounded text-2xl">arrow_back</span>
      </button>
      <span class="text-xs font-bold text-darkBrown/60 tracking-wider bg-white/70 px-3 py-1 rounded-full border border-warmBorder/60">
        단계 7 / 7
      </span>
      <button class="w-10 h-10 rounded-full bg-white/90 border border-warmBorder flex items-center justify-center text-darkBrown shadow-sm active:scale-95 transition-transform" aria-label="닫기">
        <span class="material-symbols-rounded text-2xl">close</span>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 px-6 pt-2 flex flex-col items-center justify-start text-center z-10">
      
      <!-- Headings -->
      <div class="mb-4">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 mb-2 rounded-full bg-[#FFE9D6] border border-[#FFD0B8] text-clayCoral text-xs font-bold shadow-xs">
          <span class="material-symbols-rounded text-sm">celebration</span>
          <span>부화 성공!</span>
        </div>
        <h1 class="text-[22px] font-extrabold text-darkBrown tracking-tight leading-snug">
          새 친구의 이름을 지어 주세요
        </h1>
        <p class="text-xs text-darkBrown/65 mt-1 font-medium">
          보육실에서 함께 지낼 다정한 이름을 입력해 주세요
        </p>
      </div>

      <!-- Character Stage Area -->
      <div class="relative w-full flex flex-col items-center justify-center my-auto py-2">
        
        <!-- Species & Element Badge above monster -->
        <div class="inline-flex items-center gap-2 bg-white/95 border-[1.5px] border-warmBorder px-3.5 py-1.5 rounded-full shadow-sm mb-3 z-20">
          <div class="flex items-center gap-1">
            <span class="text-xs font-bold text-darkBrown tracking-wide">종족</span>
            <span class="text-sm font-extrabold text-darkBrown">몽실</span>
          </div>
          <span class="w-[1px] h-3 bg-warmBorder"></span>
          <div class="flex items-center gap-1 text-windTeal font-bold text-xs bg-windBg px-2 py-0.5 rounded-full">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
              <path d="M12.75 3a4.75 4.75 0 0 1 4.75 4.75c0 1.25-.48 2.39-1.28 3.25h4.28a3.5 3.5 0 1 1-3.5 3.5v-1.5a2 2 0 1 0 2-2H4.5v-1.5h11.72a3.25 3.25 0 1 0-3.47-3.25V7.5a4.75 4.75 0 0 1 0-4.5zM2 17.5a2.5 2.5 0 0 1 2.5-2.5h10.25a2.5 2.5 0 1 1-2.5 2.5H2z" />
            </svg>
            <span>바람 속성</span>
          </div>
        </div>

        <!-- Floating Monster Character SVG -->
        <div class="relative flex items-center justify-center w-[220px] h-[200px] z-10">
          
          <!-- Sparkles & Hearts around monster -->
          <div class="absolute -top-1 left-4 text-[#FFB74D] animate-pulse">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/></svg>
          </div>
          <div class="absolute top-8 -right-1 text-clayCoral/80">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="absolute bottom-10 left-3 text-windTeal/70">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>
          </div>

          <!-- Monster Illustration (Baby Fluffy Sheep Monster) -->
          <div class="animate-float">
            <svg width="190" height="175" viewBox="0 0 190 175" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Soft Shadow behind head -->
              <ellipse cx="95" cy="98" rx="66" ry="58" fill="#F4E6CB" />

              <!-- Fluffy Wool Clouds (Baby Sheep Shape) -->
              <!-- Wool Puffs background -->
              <circle cx="50" cy="72" r="26" fill="#FFFDF8" stroke="#3B2F2F" stroke-width="4.5" />
              <circle cx="140" cy="72" r="26" fill="#FFFDF8" stroke="#3B2F2F" stroke-width="4.5" />
              <circle cx="58" cy="115" r="24" fill="#FFFDF8" stroke="#3B2F2F" stroke-width="4.5" />
              <circle cx="132" cy="115" r="24" fill="#FFFDF8" stroke="#3B2F2F" stroke-width="4.5" />
              <circle cx="95" cy="52" r="28" fill="#FFFDF8" stroke="#3B2F2F" stroke-width="4.5" />

              <!-- Baby Horns (Curled soft caramel pastry horns) -->
              <path d="M45 68C36 62 31 46 41 38C52 30 58 45 55 52" stroke="#3B2F2F" stroke-width="4.5" stroke-linecap="round" fill="#FAD19C" />
              <path d="M145 68C154 62 159 46 149 38C138 30 132 45 135 52" stroke="#3B2F2F" stroke-width="4.5" stroke-linecap="round" fill="#FAD19C" />

              <!-- Top Sprout / Wind Leaf Feather -->
              <path d="M95 34C91 22 81 20 81 20C81 20 89 30 95 34Z" fill="#81C784" stroke="#3B2F2F" stroke-width="3.5" stroke-linejoin="round" />
              <path d="M95 34C99 20 110 18 110 18C110 18 101 29 95 34Z" fill="#4DB6AC" stroke="#3B2F2F" stroke-width="3.5" stroke-linejoin="round" />
              <circle cx="95" cy="34" r="4.5" fill="#FFA726" stroke="#3B2F2F" stroke-width="2.5" />

              <!-- Main Face Body -->
              <circle cx="95" cy="98" r="54" fill="#FFFDF9" stroke="#3B2F2F" stroke-width="4.5" />

              <!-- Soft Wool Cheek Overlays -->
              <circle cx="58" cy="98" r="16" fill="#FFFDF9" />
              <circle cx="132" cy="98" r="16" fill="#FFFDF9" />
              <circle cx="95" cy="66" r="22" fill="#FFFDF9" />

              <!-- Pastel Rosy Cheeks -->
              <ellipse cx="68" cy="106" rx="9" ry="6" fill="#FFAB91" opacity="0.65" />
              <ellipse cx="122" cy="106" rx="9" ry="6" fill="#FFAB91" opacity="0.65" />

              <!-- Big Chibi Sparkling Eyes -->
              <!-- Left Eye -->
              <ellipse cx="76" cy="92" rx="7.5" ry="9.5" fill="#3B2F2F" />
              <circle cx="74" cy="89" r="3.2" fill="#FFFFFF" />
              <circle cx="78" cy="95" r="1.5" fill="#FFFFFF" />
              <!-- Right Eye -->
              <ellipse cx="114" cy="92" rx="7.5" ry="9.5" fill="#3B2F2F" />
              <circle cx="112" cy="89" r="3.2" fill="#FFFFFF" />
              <circle cx="116" cy="95" r="1.5" fill="#FFFFFF" />

              <!-- Cute Mouth (w-shaped kitty smile) -->
              <path d="M90 102C91.5 104.5 93.5 105 95 103.5C96.5 105 98.5 104.5 100 102" stroke="#3B2F2F" stroke-width="3.5" stroke-linecap="round" />

              <!-- Tiny Cute Feet -->
              <path d="M80 148C80 154 85 157 89 154C93 151 93 146 93 146" fill="#FAD19C" stroke="#3B2F2F" stroke-width="3.5" stroke-linecap="round" />
              <path d="M101 146C101 146 101 151 105 154C109 157 114 154 114 148" fill="#FAD19C" stroke="#3B2F2F" stroke-width="3.5" stroke-linecap="round" />
            </svg>
          </div>
        </div>

        <!-- Soft Cloud-Shaped Pedestal / Platform -->
        <div class="relative w-[260px] h-[58px] -mt-6 z-0 animate-cloud">
          <svg class="w-full h-full drop-shadow-md" viewBox="0 0 260 58" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Cloud Base -->
            <path d="M42 42C28 42 16 33 16 22C16 11 27 3 40 4C44 1.5 50 0 57 0C70 0 81 7 84 16C92 10 104 7 116 7C130 7 142 11 149 18C156 10 168 5 182 5C197 5 210 12 216 22C226 21 236 26 240 33C244 40 241 47 232 50C226 52 218 52 212 52L46 52C40 52 35 48 42 42Z" fill="#FFFFFF" stroke="#F0DFB8" stroke-width="2.5" />
            <!-- Cloud details / highlights -->
            <path d="M70 28C84 28 92 34 98 40" stroke="#FFF0D4" stroke-width="3" stroke-linecap="round" />
            <path d="M150 24C164 24 176 30 182 38" stroke="#FFF0D4" stroke-width="3" stroke-linecap="round" />
            <circle cx="128" cy="46" r="3" fill="#FFE5BA" />
            <circle cx="140" cy="46" r="2" fill="#FFE5BA" />
          </svg>
          <!-- Gentle ground shadow under cloud -->
          <div class="w-[200px] h-3 bg-[#EBD8AF]/70 rounded-full mx-auto blur-xs -mt-1"></div>
        </div>

      </div>

      <!-- Input Card Box -->
      <div class="w-full bg-creamCard rounded-[28px] border-2 border-warmBorder p-5 shadow-card mb-4 text-left">
        
        <label for="pet-name" class="block text-xs font-bold text-darkBrown/80 mb-2 flex items-center justify-between">
          <span>새 친구의 이름</span>
          <span class="text-[11px] text-darkBrown/50 font-normal">한글, 영문, 숫자 가능</span>
        </label>

        <!-- Pill text field -->
        <div class="relative flex items-center">
          <input 
            id="pet-name"
            type="text" 
            maxlength="10"
            placeholder="이름을 지어 주세요" 
            class="w-full h-[52px] bg-softPill border-2 border-warmBorder rounded-full pl-5 pr-16 text-darkBrown font-bold text-base placeholder:text-darkBrown/35 placeholder:font-medium focus:outline-none focus:border-clayCoral focus:ring-2 focus:ring-clayCoral/20 transition-all shadow-pill"
          />
          <div class="absolute right-4 flex items-center gap-1.5 pointer-events-none">
            <span class="text-xs font-bold text-darkBrown/40 bg-warmBorder/30 px-2 py-0.5 rounded-full">0/10</span>
          </div>
        </div>

        <!-- Helper warning text -->
        <div class="flex items-center gap-1.5 mt-2.5 px-2 text-[#E65100]">
          <span class="material-symbols-rounded text-sm">info</span>
          <p class="text-[11.5px] font-semibold text-darkBrown/70">
            한 번 정하면 바꿀 수 없어요
          </p>
        </div>

        <!-- Recommended quick tags -->
        <div class="mt-4 pt-3 border-t border-warmBorder/50 flex items-center gap-1.5 flex-wrap">
          <span class="text-[11px] font-bold text-darkBrown/50 mr-1">추천:</span>
          <span class="text-xs bg-[#FFF8EC] border border-warmBorder text-darkBrown/80 font-bold px-2.5 py-1 rounded-full cursor-pointer hover:border-clayCoral transition-colors">솜솜이</span>
          <span class="text-xs bg-[#FFF8EC] border border-warmBorder text-darkBrown/80 font-bold px-2.5 py-1 rounded-full cursor-pointer hover:border-clayCoral transition-colors">포근이</span>
          <span class="text-xs bg-[#FFF8EC] border border-warmBorder text-darkBrown/80 font-bold px-2.5 py-1 rounded-full cursor-pointer hover:border-clayCoral transition-colors">구름이</span>
        </div>

      </div>

    </main>

    <!-- Bottom Action Button Area (NO bottom nav bar) -->
    <footer class="p-6 pt-0 pb-8 z-10 w-full">
      <!-- Big coral full-width button (slightly faded/disabled since input is empty) -->
      <button 
        type="button" 
        disabled
        class="w-full h-[56px] rounded-full bg-clayCoral text-white font-extrabold text-[17px] tracking-wide flex items-center justify-center gap-2 opacity-50 cursor-not-allowed shadow-clay transition-all"
        aria-disabled="true"
      >
        <span class="material-symbols-rounded text-xl">favorite</span>
        <span>이 이름으로 정하기</span>
      </button>
      <p class="text-center text-[11px] text-darkBrown/45 mt-2 font-medium">
        이름을 1자 이상 입력하면 버튼이 활성화돼요
      </p>
    </footer>

    <!-- Bottom Home Indicator Bar -->
    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-darkBrown/20 rounded-full"></div>

  </div>
</body>
</html>
